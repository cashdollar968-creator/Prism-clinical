<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRISM</title>

  <link rel="stylesheet" href="./src/styles/prism.css" />
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    (async function () {
      const moduleCache = new Map();

      function makeAbsolute(specifier, baseUrl) {
        if (
          specifier.startsWith("http://") ||
          specifier.startsWith("https://") ||
          specifier.startsWith("data:") ||
          specifier.startsWith("blob:")
        ) {
          return specifier;
        }

        return new URL(specifier, baseUrl).href;
      }

      function rewriteImports(source, moduleUrl, replacements) {
        return source.replace(
          /(\bfrom\s*["']|^\s*import\s*["'])([^"']+)(["'])/gm,
          function (match, prefix, specifier, suffix) {
            if (
              specifier.startsWith("http://") ||
              specifier.startsWith("https://") ||
              specifier.startsWith("data:") ||
              specifier.startsWith("blob:")
            ) {
              return match;
            }

            const absoluteUrl = makeAbsolute(specifier, moduleUrl);

            if (!replacements.has(absoluteUrl)) {
              replacements.set(absoluteUrl, null);
            }

            return prefix + absoluteUrl + suffix;
          }
        );
      }

      async function loadModule(moduleUrl) {
        if (moduleCache.has(moduleUrl)) {
          return moduleCache.get(moduleUrl);
        }

        const promise = (async function () {
          const response = await fetch(moduleUrl, {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error(
              "Failed to load module " +
              moduleUrl +
              " (" +
              response.status +
              ")"
            );
          }

          let source = await response.text();

          const dependencies = new Map();

          source = rewriteImports(
            source,
            moduleUrl,
            dependencies
          );

          for (const dependencyUrl of dependencies.keys()) {
            if (
              dependencyUrl.startsWith(location.origin)
            ) {
              await loadModule(dependencyUrl);
            }
          }

          const transformed = Babel.transform(source, {
            presets: ["react"],
            sourceType: "module"
          }).code;

          const blob = new Blob(
            [transformed],
            { type: "text/javascript" }
          );

          const blobUrl = URL.createObjectURL(blob);

          moduleCache.set(moduleUrl, blobUrl);

          return blobUrl;
        })();

        moduleCache.set(moduleUrl, promise);

        return promise;
      }

      try {
        const entryUrl =
          new URL("./src/app.js", document.baseURI).href;

        const moduleUrl = await loadModule(entryUrl);

        await import(moduleUrl);
      } catch (error) {
        console.error("PRISM startup error:", error);

        const root = document.getElementById("root");

        if (root) {
          root.innerHTML =
            '<div style="' +
            'font-family:system-ui,sans-serif;' +
            'padding:24px;' +
            'max-width:800px;' +
            'margin:40px auto;' +
            '">' +
            '<h2>PRISM could not start</h2>' +
            '<p>The application encountered a startup error.</p>' +
            '<pre style="' +
            'white-space:pre-wrap;' +
            'background:#f5f5f5;' +
            'padding:16px;' +
            'border-radius:8px;' +
            'overflow:auto;' +
            '">' +
            String(
              error && error.stack
                ? error.stack
                : error
            ) +
            '</pre>' +
            '</div>';
        }
      }
    })();
  </script>
</body>
</html>
