<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />

  <title>PRISM — Clinical Documentation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f4f7f9;
      color: #17202a;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(180deg, #eef8f7 0%, #f7fafb 100%);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid #dce5e8;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(20, 40, 50, .08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #0f766e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-title {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-subtitle {
      color: #64748b;
      font-size: 13px;
      margin-top: 2px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .login-title {
      font-size: 22px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #334155;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 11px 12px;
      background: white;
      color: #17202a;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15,118,110,.10);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      transition: .15s ease;
    }

    .btn-primary {
      background: #0f766e;
      color: white;
    }

    .btn-primary:hover {
      background: #0b625c;
    }

    .btn-secondary {
      background: #e8eef0;
      color: #25343a;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #dce5e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-weight: 800;
      font-size: 18px;
    }

    .role-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e6fffb;
      color: #0f766e;
      text-transform: uppercase;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 220px;
      background: white;
      border-right: 1px solid #dce5e8;
      padding: 16px 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 11px 12px;
      border-radius: 9px;
      margin-bottom: 5px;
      color: #475569;
      font-weight: 650;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #eaf7f5;
      color: #0f766e;
    }

    .content {
      flex: 1;
      padding: 22px;
      max-width: 1500px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .card {
      background: white;
      border: 1px solid #dce5e8;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
      margin-top: 5px;
    }

    .stat-label {
      color: #64748b;
      font-size: 13px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .patient-card {
      cursor: pointer;
      transition: .15s ease;
    }

    .patient-card:hover {
      border-color: #8ccbc5;
      transform: translateY(-1px);
    }

    .patient-name {
      font-size: 17px;
      font-weight: 800;
    }

    .muted {
      color: #64748b;
    }

    .small {
      font-size: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .wrap {
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge-stable {
      background: #dcfce7;
      color: #166534;
    }

    .badge-improving {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-deteriorating {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-unstable {
      background: #fee2e2;
      color: #991b1b;
    }

    .timeline {
      position: relative;
      margin-top: 10px;
    }

    .timeline-item {
      border-left: 3px solid #b8dcd8;
      padding: 0 0 18px 18px;
      margin-left: 7px;
    }

    .timeline-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #0f766e;
      position: absolute;
      margin-left: -25px;
      margin-top: 4px;
    }

    .timeline-title {
      font-weight: 800;
      margin-bottom: 3px;
    }

    .timeline-body {
      color: #475569;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #64748b;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    @media (max-width: 900px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .sidebar {
        width: 185px;
      }
    }

    @media (max-width: 700px) {
      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #dce5e8;
        display: flex;
        overflow-x: auto;
        padding: 8px;
        gap: 5px;
      }

      .nav-btn {
        white-space: nowrap;
        width: auto;
        margin: 0;
      }

      .content {
        padding: 14px;
      }

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 12px;
      }

      .topbar-title {
        font-size: 16px;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useMemo, useState } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /*
      PRISM
      Supabase configuration
    */

    const SUPABASE_URL =
      "https://rcikgkdesnlfewkfeybv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Nm1XfSDRO1O_2qY20Q_eQ_Sfh0DiCf";

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const h = React.createElement;

    function formatDate(value) {
      if (!value) return "—";

      try {
        return new Date(value).toLocaleString();
      } catch {
        return value;
      }
    }

    function roleLabel(role) {
      if (role === "medical_officer") return "Medical Officer";
      if (role === "specialist") return "Specialist";
      if (role === "admin") return "Admin";
      return role || "User";
    }

    function stabilityClass(value) {
      return {
        stable: "badge-stable",
        improving: "badge-improving",
        deteriorating: "badge-deteriorating",
        unstable: "badge-unstable"
      }[value] || "";
    }

    function Login({ onLogin }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      async function submit(e) {
        e.preventDefault();

        setError("");

        if (!email || !password) {
          setError("Please enter both email and password.");
          return;
        }

        setLoading(true);

        const { data, error } =
          await db.auth.signInWithPassword({
            email: email.trim(),
            password
          });

        setLoading(false);

        if (error) {
          setError(
            error.message ||
            "Unable to sign in."
          );
          return;
        }

        if (!data?.user) {
          setError("Authentication succeeded but no user was returned.");
          return;
        }

        onLogin(data.user);
      }

      return h(
        "div",
        { className: "login-page" },

        h(
          "div",
          { className: "login-card" },

          h(
            "div",
            { className: "brand" },

            h(
              "div",
              { className: "brand-mark" },
              "P"
            ),

            h(
              "div",
              null,

              h(
                "div",
                { className: "brand-title" },
                "PRISM"
              ),

              h(
                "div",
                { className: "brand-subtitle" },
                "Problem-oriented Inpatient Review & Structured Monitoring"
              )
            )
          ),

          h(
            "h2",
            { className: "login-title" },
            "Sign in"
          ),

          error
            ? h(
                "div",
                { className: "error" },
                error
              )
            : null,

          h(
            "form",
            { onSubmit: submit },

            h(
              "div",
              { className: "field" },

              h(
                "label",
                null,
                "Email"
              ),

              h("input", {
                type: "email",
                value: email,
                autoComplete: "username",
                onChange: e => setEmail(e.target.value),
                placeholder: "name@example.com"
              })
            ),

            h(
              "div",
              { className: "field" },

              h(
                "label",
                null,
                "Password"
              ),

              h("input", {
                type: "password",
                value: password,
                autoComplete: "current-password",
                onChange: e => setPassword(e.target.value),
                placeholder: "Password"
              })
            ),

            h(
              "button",
              {
                className: "btn btn-primary",
                type: "submit",
                disabled: loading,
                style: { width: "100%" }
              },
              loading ? "Signing in..." : "Sign in"
            )
          )
        )
      );
    }

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      async function loadProfile(user) {
        setError("");

        const { data, error } = await db
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

        if (error) {
          setError(
            "Authentication succeeded, but PRISM could not load your profile: " +
            error.message
          );
          setProfile(null);
          return;
        }

        if (!data) {
          setError(
            "Your Supabase account exists, but no PRISM profile exists for this user. An administrator must create the PRISM profile."
          );
          setProfile(null);
          return;
        }

        if (data.active === false) {
          setError(
            "This PRISM account is inactive."
          );
          setProfile(null);
          return;
        }

        setProfile(data);
      }

      useEffect(() => {
        let mounted = true;

        async function initialize() {
          const {
            data: { session }
          } = await db.auth.getSession();

          if (!mounted) return;

          setSession(session);

          if (session?.user) {
            await loadProfile(session.user);
          }

          setLoading(false);
        }

        initialize();

        const {
          data: { subscription }
        } = db.auth.onAuthStateChange(
          async (_event, newSession) => {
            if (!mounted) return;

            setSession(newSession);

            if (newSession?.user) {
              await loadProfile(newSession.user);
            } else {
              setProfile(null);
            }
          }
        );

        return () => {
          mounted = false;
          subscription.unsubscribe();
        };
      }, []);

      if (loading) {
        return h(
          "div",
          { className: "loading" },
          "Loading PRISM..."
        );
      }

      if (!session) {
        return h(
          Login,
          {
            onLogin: user => {
              setSession({
                user
              });
            }
          }
        );
      }

      if (!profile) {
        return h(
          "div",
          { className: "login-page" },

          h(
            "div",
            { className: "login-card" },

            h(
              "div",
              { className: "brand" },

              h(
                "div",
                { className: "brand-mark" },
                "P"
              ),

              h(
                "div",
                null,

                h(
                  "div",
                  { className: "brand-title" },
                  "PRISM"
                ),

                h(
                  "div",
                  { className: "brand-subtitle" },
                  "Clinical Documentation"
                )
              )
            ),

            error
              ? h(
                  "div",
                  { className: "error" },
                  error
                )
              : null,

            h(
              "button",
              {
                className: "btn btn-secondary",
                onClick: async () => {
                  await db.auth.signOut();
                }
              },
              "Sign out"
            )
          )
        );
      }

      return h(
        MainApp,
        {
          profile
        }
      );
    }

    function MainApp({ profile }) {
      const [page, setPage] = useState("dashboard");
      const [patients, setPatients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [selectedPatient, setSelectedPatient] = useState(null);

      async function loadPatients() {
        setLoading(true);
        setError("");

        const { data, error } = await db
          .from("patients")
          .select(`
            id,
            patient_code,
            full_name,
            age,
            sex,
            demo,
            created_at,
            admissions (
              id,
              ward_id,
              bed_id,
              admission_datetime,
              discharge_datetime,
              status,
              responsible_mo_id,
              specialist_id,
              reason_for_admission,
              brief_summary,
              working_diagnosis,
              relevant_background,
              baseline_clinical_status,
              baseline_investigations,
              initial_plan,
              goals_targets,
              created_at
            )
          `)
          .order("created_at", {
            ascending: false
          });

        if (error) {
          setError(error.message);
          setPatients([]);
        } else {
          setPatients(data || []);
        }

        setLoading(false);
      }

      useEffect(() => {
        loadPatients();
      }, []);

      async function logout() {
        await db.auth.signOut();
      }

      const activeAdmissions = useMemo(() => {
        return patients.flatMap(patient =>
          (patient.admissions || [])
            .filter(a => a.status === "active")
            .map(admission => ({
              patient,
              admission
            }))
        );
      }, [patients]);

      function openPatient(patient) {
        setSelectedPatient(patient);
        setPage("patient");
      }

      return h(
        "div",
        { className: "app" },

        h(
          "header",
          { className: "topbar" },

          h(
            "div",
            { className: "topbar-left" },

            h(
              "div",
              { className: "brand-mark", style: { width: 36, height: 36, fontSize: 16 } },
              "P"
            ),

            h(
              "div",
              { className: "topbar-title" },
              "PRISM"
            ),

            h(
              "span",
              { className: "role-badge" },
              roleLabel(profile.role)
            )
          ),

          h(
            "button",
            {
              className: "btn btn-secondary",
              onClick: logout
            },
            "Sign out"
          )
        ),

        h(
          "div",
          { className: "layout" },

          h(
            "aside",
            { className: "sidebar" },

            h(
              "button",
              {
                className:
                  "nav-btn " +
                  (page === "dashboard" ? "active" : ""),
                onClick: () => setPage("dashboard")
              },
              "Dashboard"
            ),

            h(
              "button",
              {
                className:
                  "nav-btn " +
                  (page === "patients" ? "active" : ""),
                onClick: () => setPage("patients")
              },
              "Patients"
            ),

            h(
              "button",
              {
                className:
                  "nav-btn " +
                  (page === "specialists" ? "active" : ""),
                onClick: () => setPage("specialists")
              },
              "Specialist Queue"
            ),

            profile.role === "admin"
              ? h(
                  "button",
                  {
                    className:
                      "nav-btn " +
                      (page === "admin" ? "active" : ""),
                    onClick: () => setPage("admin")
                  },
                  "Administration"
                )
              : null
          ),

          h(
            "main",
            { className: "content" },

            error
              ? h(
                  "div",
                  { className: "error" },
                  error
                )
              : null,

            page === "dashboard"
              ? h(
                  Dashboard,
                  {
                    profile,
                    activeAdmissions,
                    loading,
                    onRefresh: loadPatients,
                    onOpenPatient: openPatient
                  }
                )
              : null,

            page === "patients"
              ? h(
                  PatientsPage,
                  {
                    patients,
                    loading,
                    onOpenPatient: openPatient,
                    onRefresh: loadPatients
                  }
                )
              : null,

            page === "patient" && selectedPatient
              ? h(
                  PatientPage,
                  {
                    patient: selectedPatient,
                    profile,
                    onBack: () => setPage("patients")
                  }
                )
              : null,

            page === "specialists"
              ? h(
                  SpecialistQueue,
                  {
                    profile
                  }
                )
              : null,

            page === "admin" && profile.role === "admin"
              ? h(
                  AdminPage,
                  {
                    profile
                  }
                )
              : null
          )
        )
      );
    }

    function Dashboard({
      profile,
      activeAdmissions,
      loading,
      onRefresh,
      onOpenPatient
    }) {
      const stable = activeAdmissions.filter(
        x =>
          x.admission.latest_stability === "stable"
      ).length;

      return h(
        React.Fragment,
        null,

        h(
          "div",
          { className: "page-title" },
          "Dashboard"
        ),

        h(
          "div",
          { className: "page-subtitle" },
          "Current inpatient overview"
        ),

        h(
          "div",
          { className: "grid grid-4" },

          h(
            "div",
            { className: "card" },

            h(
              "div",
              { className: "stat-label" },
              "Active Admissions"
            ),

            h(
              "div",
              { className: "stat-number" },
              activeAdmissions.length
            )
          ),

          h(
            "div",
            { className: "card" },

            h(
              "div",
              { className: "stat-label" },
              "Medical Officers"
            ),

            h(
              "div",
              { className: "stat-number" },
              profile.role === "medical_officer" ? "1" : "—"
            )
          ),

          h(
            "div",
            { className: "card" },

            h(
              "div",
              { className: "stat-label" },
              "Role"
            ),

            h(
              "div",
              { className: "stat-number", style: { fontSize: 20 } },
              roleLabel(profile.role)
            )
          ),

          h(
            "div",
            { className: "card" },

            h(
              "div",
              { className: "stat-label" },
              "System"
            ),

            h(
              "div",
              {
                className: "stat-number",
                style: {
                  fontSize: 20,
                  color: "#0f766e"
                }
              },
              "ONLINE"
            )
          )
        ),

        h(

      const [problems, setProblems] = useState([]);

      async function loadClinicalData() {
        if (!admission) {
          setLoading(false);
          return;
        }

        setLoading(true);

        const [
          updatesResult,
          problemsResult,
          investigationsResult,
          reviewsResult
        ] = await Promise.all([

          db
            .from("daily_updates")
            .select("*")
            .eq("admission_id", admission.id)
            .order("occurred_at", {
              ascending: false
            }),

          db
            .from("problems")
            .select("*")
            .eq("admission_id", admission.id)
            .order("problem_no", {
              ascending: true
            }),

          db
            .from("investigations")
            .select("*")
            .eq("admission_id", admission.id)
            .order("performed_at", {

          db
            .from("specialist_reviews")
            .select("*")
            .eq("admission_id", admission.id)
            .order("reviewed_at", {
              ascending: false
            })

        setUpdates(updatesResult.data || []);
        setProblems(problemsResult.data || []);
        setInvestigations(
          investigationsResult.data || []

        setReviews(reviewsResult.data || []);

    function FollowupModal({
      admissionId,
      onClose,
      onSaved
    }) {
      const [form, setForm] = useState({
        clinical_changes: "",
        new_results: "",
        problems_assessment: "",
        clinical_stability: "stable",
        response: "",
        management_changes: "",
        remaining_inpatient_needs: "",
        why_still_admitted: "",
        recommendation_next_steps: "",
        escalation_red_flags: ""
      });

      const [saving, setSaving] = useState(false);
      const [error, setError] = useState("");

      function update(field, value) {
        setForm(old => ({
          ...old,
          [field]: value
        }));
      }

      async function save() {
        setError("");

        if (!form.clinical_stability) {
          setError(
            "Clinical stability is required."
          );
          return;
        }

        setSaving(true);

        const {
          data: {
            user
          }
        } = await db.auth.getUser();

        if (!user) {
          setSaving(false);
          setError("Authentication session expired.");
          return;
        }

        const { error } = await db
          .from("daily_updates")
          .insert({
            admission_id: admissionId,
            author_id: user.id,
            occurred_at: new Date().toISOString(),
            clinical_changes: form.clinical_changes,
            new_results: form.new_results,
            problems_assessment: form.problems_assessment,
            clinical_stability: form.clinical_stability,
            response: form.response,
            management_changes: form.management_changes,
            remaining_inpatient_needs:
              form.remaining_inpatient_needs,
            why_still_admitted:
              form.why_still_admitted,
            recommendation_next_steps:
              form.recommendation_next_steps,
            escalation_red_flags:
              form.escalation_red_flags
          });

        setSaving(false);

        if (error) {
          setError(error.message);
          return;
        }

        await onSaved();
      }

      return h(
        "div",
        {
          style: {
            position: "fixed",
            inset: 0,
            background: "rgba(15,23,42,.45)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 15,
            zIndex: 100
          }
        },

        h(
          "div",
          {
            className: "card",
            style: {
              width: "100%",
              maxWidth: 700,
              maxHeight: "92vh",
              overflowY: "auto",
              margin: 0
            }
          },

          h(
            "div",
            { className: "row" },

            h(
              "div",
              { className: "section-title" },
              "Daily Follow-up"
            ),

            h(
              "button",
              {
                className: "btn btn-secondary",
                onClick: onClose
              },
              "Close"
            )
          ),

          error
            ? h(
                "div",
                { className: "error" },
                error
              )
            : null,

          h(
            FollowupField,
            {
              label: "Clinical Changes / Events",
              value: form.clinical_changes,
              onChange: v =>
                update("clinical_changes", v)
            }
          ),

          h(
            FollowupField,
            {
              label: "New Important Results",
              value: form.new_results,
              onChange: v =>
                update("new_results", v)
            }
          ),

          h(
            FollowupField,
            {
              label: "Problems / Assessment",
              value: form.problems_assessment,
              onChange: v =>
                update("problems_assessment", v)
            }
          ),

          h(
            "div",
            { className: "field" },

            h(
              "label",
              null,
              "Clinical Stability *"
            ),

            h(
              "select",
              {
                value: form.clinical_stability,
                onChange: e =>
                  update(
                    "clinical_stability",
                    e.target.value
                  )
              },

              h("option", { value: "stable" }, "Stable"),
              h("option", { value: "improving" }, "Improving"),
              h("option", { value: "deteriorating" }, "Deteriorating"),
              h("option", { value: "unstable" }, "Unstable")
            )
          ),

          h(
            FollowupField,
            {
              label: "Response",
              value: form.response,
              onChange: v =>

            }
          ),

          h(

            }
          ),

          h(

                update(

                  v
                )
            }
          ),

          h(

          ),

    function SpecialistQueue({ profile }) {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      async function load() {
        setLoading(true);

        let query = db
          .from("specialist_requests")
          .select("*")
          .order("requested_at", {
            ascending: false
          });

        if (profile.role === "specialist") {
          query = query.eq(
            "specialist_id",
            profile.id
          );
        }

        const { data, error } =
          await query;

        if (error) {
          setError(error.message);
          setRequests([]);
        } else {
          setRequests(data || []);
        }

        setLoading(false);
      }

      useEffect(() => {
        load();

    }

    function AdminPage({ profile }) {
      const [profiles, setProfiles] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [wards, setWards] = useState([]);
      const [beds, setBeds] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      async function load() {
        setLoading(true);
        setError("");

        const [
          p,
          d,
          w,
          b
        ] = await Promise.all([

          db
            .from("profiles")
            .select("*")
            .order("created_at", {
              ascending: false
            }),

          db
            .from("departments")
            .select("*")
            .order("name"),

          db
            .from("wards")
            .select("*")
            .order("name"),

          db
            .from("beds")
            .select("*")
            .order("name")
        ]);

        const errors = [
          p.error,
          d.error,
          w.error,
          b.error
        ].filter(Boolean);

        if (errors.length) {
          setError(
            errors.map(e => e.message).join(" | ")
          );
        }

        setProfiles(p.data || []);
        setDepartments(d.data || []);
        setWards(w.data || []);
        setBeds(b.data || []);

        setLoading(false);
      }

      useEffect(() => {
        load();
      }, []);

      return h(
        React.Fragment,
        null,

        h(
          "div",
          { className: "page-title" },
          "Administration"
        ),

        h(
          "div",
          { className: "page-subtitle" },
          "PRISM configuration and user overview"
        ),

        error
          ? h(
              "div",
              { className: "error" },
              error
            )
          : null,

        h(
          "div",
          { className: "grid grid-4" },

          h(
            "div",
            { className: "card" },
            h(
              "div",
              { className: "stat-label" },
              "Users"
            ),
            h(
              "div",
              { className: "stat-number" },
              profiles.length
            )
          ),

          h(
            "div",
            { className: "card" },
            h(
              "div",
              { className: "stat-label" },
              "Departments"
            ),
            h(
              "div",
              { className: "stat-number" },
              departments.length
            )
          ),

          h(
            "div",
            { className: "card" },
            h(
              "div",
              { className: "stat-label" },
              "Wards"
            ),
            h(
              "div",
              { className: "stat-number" },
              wards.length
            )
          ),

          h(
            "div",
            { className: "card" },
            h(
              "div",
              { className: "stat-label" },
              "Beds"
            ),
            h(
              "div",
              { className: "stat-number" },
              beds.length
            )
          )
        ),

        h(
          "div",
          { className: "card" },

          h(
            "div",
            { className: "row" },

            h(
              "div",
              { className: "section-title" },
              "PRISM Users"
            ),

            h(
              "button",
              {
                className: "btn btn-secondary",
                onClick: load
              },
              "Refresh"
            )
          ),

          loading
            ? h(
                "div",
                { className: "loading" },
                "Loading..."
              )
            : profiles.length === 0
              ? h(
                  "div",
                  { className: "empty" },
                  "No PRISM profiles found."
                )
              : h(
                  "div",
                  { className: "table-wrap" },

                  h(
                    "table",
                    null,

                    h(
                      "thead",
                      null,

                      h(
                        "tr",
                        null,

                        h("th", null, "Name"),
                        h("th", null, "Email"),
                        h("th", null, "Role"),
                        h("th", null, "Active")
                      )
                    ),

                    h(
                      "tbody",
                      null,

                      profiles.map(user =>
                        h(
                          "tr",
                          { key: user.id },

                          h(
                            "td",
                            null,
                            user.display_name || "—"
                          ),

                          h(
                            "td",
                            null,
                            user.email || "—"
                          ),

                          h(
                            "td",
                            null,
                            roleLabel(user.role)
                          ),

                          h(
                            "td",
                            null,
                            user.active ? "Yes" : "No"
                          )
                        )
                      )
                    )
                  )
                )
        )
      );
    }

    createRoot(
      document.getElementById("root")
    ).render(
      h(App)
    );
  </script>
</body>
  </html>
