<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM — Clinical Documentation</title>

<style>
:root{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#172033;
  background:#f5f7fa
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fa
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

header{
  background:#102a43;
  color:#fff;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:5
}

.brand{
  font-weight:800;
  letter-spacing:.5px
}

.sub{
  font-size:12px;
  opacity:.75
}

main{
  max-width:1180px;
  margin:auto;
  padding:18px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:1px solid #dfe5ec;
  border-radius:12px;
  padding:16px;
  box-shadow:0 1px 2px #00000008;
  margin-bottom:14px
}

h1,h2,h3{
  margin:0 0 12px
}

h2{
  font-size:21px
}

h3{
  font-size:16px
}

.muted{
  color:#667085
}

.danger{
  color:#b42318
}

.ok{
  color:#067647
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2f6;
  font-size:12px;
  margin:2px
}

.btn{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  background:#155eef;
  color:white
}

.btn.secondary{
  background:#e9eef5;
  color:#172033
}

.btn.dangerBtn{
  background:#b42318;
  color:#fff
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.between{
  justify-content:space-between
}

nav{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:16px
}

.navbtn{
  white-space:nowrap;
  border:1px solid #d0d5dd;
  background:#fff;
  border-radius:8px;
  padding:8px 11px
}

.navbtn.active{
  background:#102a43;
  color:#fff
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:10px 0 5px
}

input,select,textarea{
  width:100%;
  border:1px solid #cfd6df;
  border-radius:8px;
  padding:9px;
  background:#fff
}

textarea{
  min-height:82px;
  resize:vertical
}

.item{
  padding:12px;
  border:1px solid #e4e7ec;
  border-radius:9px;
  margin-top:8px
}

.click{
  cursor:pointer
}

.click:hover{
  background:#f8fafc
}

.timeline{
  border-left:3px solid #d0d5dd;
  padding-left:14px
}

.event{
  margin:0 0 14px
}

.small{
  font-size:12px
}

.login{
  max-width:420px;
  margin:12vh auto
}

.errorBox{
  background:#fff1f0;
  border:1px solid #f1b5b0;
  padding:10px;
  border-radius:8px;
  margin-top:14px
}

.successBox{
  background:#ecfdf3;
  border:1px solid #a6e3bd;
  padding:10px;
  border-radius:8px;
  margin-top:14px
}

.notice{
  background:#f8fafc;
  border:1px solid #dfe5ec;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:14px
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:9px;
  border-bottom:1px solid #eee;
  font-size:13px
}

.loading{
  text-align:center;
  padding:40px;
  color:#667085
}

@media(max-width:600px){

  main{
    padding:10px
  }

  .card{
    padding:13px
  }

  header{
    padding:12px
  }

  table{
    display:block;
    overflow-x:auto
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script type="module">

import React,{useEffect,useState} from
"https://esm.sh/react@18.3.1";

import {createRoot} from
"https://esm.sh/react-dom@18.3.1/client";

import {createClient} from
"https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
"https://rcikgkdesnlfewkfeybv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nm1XfSDRO1O_2qY20Q_eQ_Sfh0DiCf";

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const h = React.createElement;


/* =========================================================
   EMPTY DAILY FOLLOW-UP
   ========================================================= */

const blank = {
  clinical_changes:"",
  new_results:"",
  problems_assessment:"",
  clinical_stability:"stable",
  response:"",
  management_changes:"",
  remaining_inpatient_needs:"",
  why_still_admitted:"",
  recommendation_next_steps:"",
  escalation_red_flags:""
};


/* =========================================================
   LOGIN
   ========================================================= */

function Login(){

  const [e,setE] = useState("");
  const [p,setP] = useState("");
  const [err,setErr] = useState("");
  const [loading,setLoading] = useState(false);

  async function go(ev){

    ev.preventDefault();

    setErr("");
    setLoading(true);

    const {error} =
      await db.auth.signInWithPassword({
        email:e.trim(),
        password:p
      });

    setLoading(false);

    if(error){
      setErr(error.message);
    }
  }

  return h(
    "div",
    {className:"login card"},

    h(
      "h1",
      null,
      "PRISM"
    ),

    h(
      "p",
      {className:"muted"},
      "Problem-oriented Inpatient Review & Structured Monitoring"
    ),

    h(
      "form",
      {onSubmit:go},

      h(
        "label",
        null,
        "Email"
      ),

      h(
        "input",
        {
          type:"email",
          required:true,
          autoComplete:"email",
          value:e,
          onChange:x=>setE(x.target.value)
        }
      ),

      h(
        "label",
        null,
        "Password"
      ),

      h(
        "input",
        {
          type:"password",
          required:true,
          autoComplete:"current-password",
          value:p,
          onChange:x=>setP(x.target.value)
        }
      ),

      h("br"),

      h(
        "button",
        {
          className:"btn",
          type:"submit",
          disabled:loading,
          style:{
            width:"100%",
            opacity:loading ? .7 : 1
          }
        },
        loading
          ? "Signing in..."
          : "Sign in"
      )
    ),

    err &&
      h(
        "div",
        {className:"errorBox"},
        h(
          "strong",
          null,
          "Sign in failed"
        ),
        h(
          "div",
          {style:{marginTop:5}},
          err
        )
      )
  );
}


/* =========================================================
   MAIN APPLICATION
   ========================================================= */

function App(){

  const [sess,setSess] = useState(null);
  const [profile,setProfile] = useState(null);
  const [loading,setLoading] = useState(true);
  const [profileLoading,setProfileLoading] = useState(false);

  const [tab,setTab] =
    useState("dashboard");

  const [patients,setPatients] =
    useState([]);

  const [sel,setSel] =
    useState(null);

  const [msg,setMsg] =
    useState("");

  const [error,setError] =
    useState("");


  /* -------------------------------------------------------
     AUTH SESSION
     ------------------------------------------------------- */

  useEffect(()=>{

    let mounted = true;

    async function start(){

      const {
        data,
        error
      } = await db.auth.getSession();

      if(!mounted)
        return;

      if(error){
        setError(error.message);
      }

      setSess(data?.session || null);
      setLoading(false);
    }

    start();

    const {
      data
    } =
      db.auth.onAuthStateChange(
        (_event,session)=>{

          if(mounted){
            setSess(session);
          }
        }
      );

    return ()=>{

      mounted=false;

      data.subscription.unsubscribe();
    };

  },[]);


  /* -------------------------------------------------------
     LOAD PROFILE
     ------------------------------------------------------- */

  useEffect(()=>{

    if(sess){

      loadProfileAndData();

    }else{

      setProfile(null);
      setPatients([]);
    }

  },[sess]);


  async function loadProfileAndData(){

    setProfileLoading(true);
    setMsg("");
    setError("");

    const {
      data:profileData,
      error:profileError
    } =
      await db
        .from("profiles")
        .select("*")
        .eq("id",sess.user.id)
        .maybeSingle();


    if(profileError){

      setError(profileError.message);
      setProfile(null);
      setProfileLoading(false);

      return;
    }


    setProfile(profileData);


    if(!profileData){

      setProfileLoading(false);
      return;
    }


    await loadPatients();

    setProfileLoading(false);
  }


  /* -------------------------------------------------------
     LOAD PATIENTS
     ------------------------------------------------------- */

  async function loadPatients(){

    const r =
      await db
        .from("patients")
        .select(`
          *,
          admissions(
            id,
            status,
            ward_id,
            bed_id,
            admission_datetime,
            working_diagnosis
          )
        `)
        .order(
          "updated_at",
          {ascending:false}
        );


    if(r.error){

      setError(r.error.message);
      return;
    }


    setPatients(r.data || []);
  }


  /* -------------------------------------------------------
     LOGOUT
     ------------------------------------------------------- */

  async function logout(){

    await db.auth.signOut();

    setSess(null);
    setProfile(null);
    setPatients([]);
    setSel(null);
    setTab("dashboard");
  }


  /* -------------------------------------------------------
     LOADING
     ------------------------------------------------------- */

  if(loading){

    return h(
      "div",
      {className:"loading"},
      "Loading PRISM..."
    );
  }


  /* -------------------------------------------------------
     LOGIN
     ------------------------------------------------------- */

  if(!sess){

    return h(Login);
  }


  /* -------------------------------------------------------
     PROFILE LOADING
     ------------------------------------------------------- */

  if(profileLoading){

    return h(
      "div",
      {className:"loading"},
      "Loading user profile..."
    );
  }


  /* -------------------------------------------------------
     NO PROFILE
     ------------------------------------------------------- */

  if(!profile){

    return h(

      "main",

      h(
        "div",
        {className:"card"},

        h(
          "h2",
          null,
          "Account authenticated"
        ),

        h(
          "p",
          {className:"muted"},
          "This authentication account does not yet have an active PRISM profile."
        ),

        h(
          "p",
          null,
          "Ask a PRISM administrator to create or activate the profile for this account."
        ),

        error &&
          h(
            "div",
            {className:"errorBox"},
            error
          ),

        h(
          "button",
          {
            className:"btn secondary",
            onClick:logout
          },
          "Sign out"
        )
      )
    );
  }


  /* -------------------------------------------------------
     ACTIVE PATIENTS
     ------------------------------------------------------- */

  const active =
    patients.filter(
      p =>
        (p.admissions || [])
          .some(
            a=>a.status==="active"
          )
    );


  /* -------------------------------------------------------
     OPEN PATIENT
     ------------------------------------------------------- */

  const open = p =>{

    setSel(p);
    setTab("patient");
  };


  /* -------------------------------------------------------
     CONTENT
     ------------------------------------------------------- */

  let content;


  /* =======================================================
     DASHBOARD
     ======================================================= */

  if(tab==="dashboard"){

    content =
      h(

        "div",

        h(
          "div",
          {className:"row between"},

          h(
            "div",

            h(
              "h2",
              null,
              "Dashboard"
            ),

            h(
              "p",
              {className:"muted"},
              "Current inpatient overview"
            )
          ),

          h(
            "button",
            {
              className:"btn",
              onClick:loadPatients
            },
            "Refresh"
          )
        ),


        h(
          "div",
          {className:"grid"},

          h(
            "div",
            {className:"card"},

            h(
              "h3",
              null,
              "Active admissions"
            ),

            h(
              "h2",
              null,
              active.length
            )
          ),


          h(
            "div",
            {className:"card"},

            h(
              "h3",
              null,
              "Authorized patients"
            ),

            h(
              "h2",
              null,
              patients.length
            )
          )
        ),


        h(
          "div",
          {className:"card"},

          h(
            "h3",
            null,
            "Patients"
          ),

          active.length

          ?

          active.map(
            p =>
              h(
                Card,
                {
                  key:p.id,
                  p,
                  onClick:()=>open(p)
                }
              )
          )

          :

          h(
            "p",
            {className:"muted"},
            "No active admissions."
          )
        )
      );
  }


  /* =======================================================
     PATIENTS
     ======================================================= */

  else if(tab==="patients"){

    content =
      h(
        Patients,
        {
          patients,
          onClick:open,
          onRefresh:loadPatients
        }
      );
  }


  /* =======================================================
     PATIENT
     ======================================================= */

  else if(
    tab==="patient" &&
    sel
  ){

    content =
      h(
        Patient,
        {
          p:sel,
          profile,
          onBack:()=>{
            setTab("patients");
            loadPatients();
          }
        }
      );
  }


  /* =======================================================
     ADMIN
     ======================================================= */

  else if(
    tab==="admin" &&
    profile.role==="admin"
  ){

    content =
      h(Admin);
  }


  /* =======================================================
     SPECIALIST QUEUE
     ======================================================= */

  else{

    content =
      h(
        "div",
        {className:"card"},

        h(
          "h2",
          null,
          "Specialist queue"
        ),

        h(
          "p",
          {className:"muted"},
          "Specialist requests and reviews will appear here."
        )
      );
  }


  /* =======================================================
     APPLICATION SHELL
     ======================================================= */

  return h(

    "div",

    h(
      "header",

      h(
        "div",

        h(
          "div",
          {className:"brand"},
          "PRISM"
        ),

        h(
          "div",
          {className:"sub"},
          "Clinical documentation • " +
          profile.role
        )
      ),

      h(
        "button",
        {
          className:"btn secondary",
          onClick:logout
        },
        "Sign out"
      )
    ),


    h(
      "main",

      h(
        "nav",

        ...[
          "dashboard",
          "patients",
          "queue",

          ...(profile.role==="admin"
            ? ["admin"]
            : [])

        ].map(

          x =>

            h(
              "button",
              {
                key:x,

                className:
                  "navbtn " +
                  (
                    tab===x
                    ? "active"
                    : ""
                  ),

                onClick:()=>{
                  setTab(x);
                }
              },

              x==="queue"
                ? "Specialist queue"
                : x[0].toUpperCase()+
                  x.slice(1)
            )
        )
      ),


      error &&

        h(
          "div",
          {className:"errorBox"},
          error
        ),


      msg &&

        h(
          "div",
          {className:"notice"},
          msg
        ),


      content
    )
  );
}


/* =========================================================
   PATIENT CARD
   ========================================================= */

function Card({
  p,
  onClick
}){

  const a =
    (p.admissions || [])
      .find(
        x=>x.status==="active"
      );


  return h(

    "div",

    {
      className:"item click",
      onClick
    },

    h(
      "div",
      {className:"row between"},

      h(
        "strong",
        null,
        p.patient_code
      ),

      h(
        "span",
        {className:"badge"},
        p.demo
          ? "DEMO"
          : "OPERATIONAL"
      )
    ),

    h(
      "div",
      null,

      (p.full_name ||
       "Unnamed patient") +

      " • " +

      p.age +

      " / " +

      p.sex
    ),

    a &&

      h(
        "div",
        {className:"muted small"},
        a.working_diagnosis ||
        "No working diagnosis"
      )
  );
}


/* =========================================================
   PATIENT LIST
   ========================================================= */

function Patients({
  patients,
  onClick,
  onRefresh
}){

  const [q,setQ] =
    useState("");


  const list =
    patients.filter(

      p =>
        JSON.stringify(p)
          .toLowerCase()
          .includes(
            q.toLowerCase()
          )
    );


  return h(

    "div",

    h(
      "div",
      {className:"row between"},

      h(
        "h2",
        null,
        "Patients"
      ),

      h(
        "button",
        {
          className:"btn secondary",
          onClick:onRefresh
        },
        "Refresh"
      )
    ),


    h(
      "input",
      {
        placeholder:
          "Search patient code, name, diagnosis…",

        value:q,

        onChange:e=>
          setQ(e.target.value)
      }
    ),


    h(
      "div",
      {
        className:"grid",
        style:{
          marginTop:12
        }
      },

      list.map(

        p =>

          h(
            Card,
            {
              key:p.id,
              p,
              onClick:
                ()=>onClick(p)
            }
          )
      )
    )
  );
}


/* =========================================================
   PATIENT PAGE
   ========================================================= */

function Patient({
  p,
  profile,
  onBack
}){

  const a =
    (p.admissions || [])
      .find(
        x=>x.status==="active"
      )
      ||
    (p.admissions || [])[0];


  const [ad,setAd] =
    useState(null);

  const [updates,setUpdates] =
    useState([]);

  const [reviews,setReviews] =
    useState([]);

  const [form,setForm] =
    useState(blank);

  const [show,setShow] =
    useState(false);

  const [notice,setNotice] =
    useState("");


  useEffect(()=>{

    if(a)
      load();

  },[a?.id]);


  async function load(){

    if(!a)
      return;


    const [
      x,
      y,
      z
    ] = await Promise.all([

      db
        .from("admissions")
        .select("*")
        .eq("id",a.id)
        .single(),

      db
        .from("daily_updates")
        .select(
          "*,profiles(display_name)"
        )
        .eq(
          "admission_id",
          a.id
        )
        .order(
          "occurred_at",
          {ascending:false}
        ),

      db
        .from("specialist_reviews")
        .select(
          "*,profiles(display_name)"
        )
        .eq(
          "admission_id",
          a.id
        )
        .order(
          "reviewed_at",
          {ascending:false}
        )
    ]);


    setAd(x.data);
    setUpdates(y.data || []);
    setReviews(z.data || []);
  }


  async function save(ev){

    ev.preventDefault();

    setNotice("");


    const {
      error
    } = await db
      .from("daily_updates")
      .insert({

        ...form,

        admission_id:a.id,

        author_id:profile.id,

        occurred_at:
          new Date().toISOString()

      });


    if(error){

      setNotice(
        error.message
      );

    }else{

      setNotice(
        "Follow-up saved successfully."
      );

      setForm(blank);

      setShow(false);

      load();
    }
  }


  if(!a){

    return h(
      "div",
      {className:"card"},

      h(
        "h2",
        null,
        "No admission"
      ),

      h(
        "button",
        {
          className:"btn",
          onClick:onBack
        },
        "Back"
      )
    );
  }


  return h(

    "div",

    h(
      "button",
      {
        className:"btn secondary",
        onClick:onBack
      },
      "← Patients"
    ),


    h(
      "div",
      {
        className:"card",
        style:{marginTop:10}
      },

      h(
        "div",
        {className:"row between"},

        h(
          "h2",
          null,

          p.patient_code +
          " — " +
          (
            p.full_name ||
            "Patient"
          )
        ),

        h(
          "span",
          {className:"badge"},

          p.demo
            ? "DEMO"
            : "OPERATIONAL"
        )
      ),


      h(
        "p",
        {className:"muted"},

        p.age +
        " / " +
        p.sex +
        " • " +

        new Date(
          a.admission_datetime
        ).toLocaleString()
      ),


      h(
        "h3",
        null,
        "Why admitted"
      ),

      h(
        "p",
        null,
        ad?.reason_for_admission ||
        "—"
      ),


      h(
        "h3",
        null,
        "Working diagnosis"
      ),

      h(
        "p",
        null,
        ad?.working_diagnosis ||
        "—"
      ),


      h(
        "h3",
        null,
        "Baseline"
      ),

      h(
        "p",
        null,
        ad?.baseline_clinical_status ||
        "—"
      ),


      h(
        "h3",
        null,
        "Initial plan"
      ),

      h(
        "p",
        null,
        ad?.initial_plan ||
        "—"
      )
    ),


    h(
      "div",
      {className:"card"},

      h(
        "div",
        {className:"row between"},

        h(
          "h3",
          null,
          "Daily follow-up"
        ),

        h(
          "button",
          {
            className:"btn",
            onClick:()=>{
              setShow(!show);
              setNotice("");
            }
          },
          "+ Add"
        )
      ),


      notice &&

        h(
          "p",
          {
            className:
              notice.includes(
                "successfully"
              )
              ? "ok"
              : "danger"
          },
          notice
        ),


      show &&

        h(
          "form",
          {onSubmit:save},

          Object.keys(blank).map(

            k =>

              h(
                "div",
                {key:k},

                h(
                  "label",
                  null,
                  k.replaceAll(
                    "_",
                    " "
                  )
                ),

                k==="clinical_stability"

                ?

                h(
                  "select",
                  {
                    value:form[k],

                    onChange:e=>
                      setForm({
                        ...form,
                        [k]:
                          e.target.value
                      })
                  },

                  [
                    "stable",
                    "improving",
                    "deteriorating",
                    "unstable"
                  ].map(

                    v=>

                      h(
                        "option",
                        {
                          key:v,
                          value:v
                        },
                        v
                      )
                  )
                )

                :

                h(
                  "textarea",
                  {
                    value:form[k],

                    onChange:e=>
                      setForm({
                        ...form,
                        [k]:
                          e.target.value
                      })
                  }
                )
              )
          ),


          h(
            "button",
            {
              className:"btn",
              type:"submit"
            },
            "Save follow-up"
          )
        ),


      h(
        "div",
        {
          className:"timeline",
          style:{
            marginTop:14
          }
        },

        updates.map(

          u =>

            h(
              "div",
              {
                className:"event",
                key:u.id
              },

              h(
                "strong",
                null,

                new Date(
                  u.occurred_at
                ).toLocaleString()
              ),

              h(
                "span",
                {className:"badge"},
                u.clinical_stability
              ),

              u.clinical_changes &&

                h(
                  "p",
                  null,
                  u.clinical_changes
                ),

              u.problems_assessment &&

                h(
                  "p",
                  null,

                  h(
                    "strong",
                    null,
                    "Problems / Assessment: "
                  ),

                  u.problems_assessment
                ),

              u.response &&

                h(
                  "p",
                  null,

                  h(
                    "strong",
                    null,
                    "Response: "
                  ),

                  u.response
                ),

              u.management_changes &&

                h(
                  "p",
                  null,

                  h(
                    "strong",
                    null,
                    "Management changes: "
                  ),

                  u.management_changes
                ),

              u.remaining_inpatient_needs &&

                h(
                  "p",
                  null,

                  h(
                    "strong",
                    null,
                    "Remaining inpatient needs: "
                  ),

                  u.remaining_inpatient_needs
                ),

              u.recommendation_next_steps &&

                h(
                  "p",
                  {className:"muted"},

                  h(
                    "strong",
                    null,
                    "Next steps: "
                  ),

                  u.recommendation_next_steps
                )
            )
        ),

        !updates.length &&

          h(
            "p",
            {className:"muted"},
            "No daily updates yet."
          )
      )
    ),


    h(
      "div",
      {className:"card"},

      h(
        "h3",
        null,
        "Specialist reviews"
      ),

      reviews.map(

        r =>

          h(
            "div",
            {
              className:"item",
              key:r.id
            },

            h(
              "strong",
              null,

              new Date(
                r.reviewed_at
              ).toLocaleString()
            ),

            h(
              "p",
              null,
              r.clinical_assessment
            ),

            h(
              "p",
              {className:"muted"},
              r.recommendations
            )
          )
      ),

      !reviews.length &&

        h(
          "p",
          {className:"muted"},
          "No specialist reviews recorded."
        )
    )
  );
}


/* =========================================================
   ADMIN PAGE
   ========================================================= */

function Admin(){

  const [profiles,setProfiles] =
    useState([]);

  const [departments,setDepartments] =
    useState([]);

  const [wards,setWards] =
    useState([]);

  const [beds,setBeds] =
    useState([]);

  const [loading,setLoading] =
    useState(true);

  const [error,setError] =
    useState("");


  async function load(){

    setLoading(true);
    setError("");


    const [
      p,
      d,
      w,
      b
    ] = await Promise.all([

      db
        .from("profiles")
        .select("*")
        .order("created_at"),

      db
        .from("departments")
        .select("*")
        .order("name"),

      db
        .from("wards")
        .select("*")
        .order("name"),

      db
        .from("beds")
        .select("*")
        .order("name")
    ]);


    if(p.error)
      setError(p.error.message);

    else if(d.error)
      setError(d.error.message);

    else if(w.error)
      setError(w.error.message);

    else if(b.error)
      setError(b.error.message);


    setProfiles(
      p.data || []
    );

    setDepartments(
      d.data || []
    );

    setWards(
      w.data || []
    );

    setBeds(
      b.data || []
    );

    setLoading(false);
  }


  useEffect(()=>{
    load();
  },[]);


  if(loading){

    return h(
      "div",
      {className:"loading"},
      "Loading administration..."
    );
  }


  return h(

    "div",

    h(
      "div",
      {className:"row between"},

      h(
        "h2",
        null,
        "Administration"
      ),

      h(
        "button",
        {
          className:"btn secondary",
          onClick:load
        },
        "Refresh"
      )
    ),


    error &&

      h(
        "div",
        {className:"errorBox"},
        error
      ),


    h(
      "div",
      {className:"card"},

      h(
        "h3",
        null,
        "PRISM Users"
      ),

      h(
        "p",
        {className:"muted small"},
        "Authentication accounts are managed through Supabase Authentication. PRISM profiles define the application role."
      ),


      profiles.length

      ?

      h(
        "table",

        h(
          "thead",

          h(
            "tr",

            h(
              "th",
              null,
              "Name"
            ),

            h(
              "th",
              null,
              "Email"
            ),

            h(
              "th",
              null,
              "Role"
            ),

            h(
              "th",
              null,
              "Active"
            )
          )
        ),


        h(
          "tbody",

          profiles.map(

            x =>

              h(
                "tr",
                {key:x.id},

                h(
                  "td",
                  null,
                  x.display_name ||
                  "—"
                ),

                h(
                  "td",
                  null,
                  x.email ||
                  "—"
                ),

                h(
                  "td",
                  null,

                  h(
                    "span",
                    {className:"badge"},
                    x.role
                  )
                ),

                h(
                  "td",
                  null,
                  x.active
                    ? "Active"
                    : "Inactive"
                )
              )
          )
        )
      )

      :

      h(
        "p",
        {className:"muted"},
        "No PRISM profiles found."
      )
    ),


    h(
      "div",
      {
        className:"grid"
      },

      h(
        ReferenceCard,
        {
          title:"Departments",
          items:departments
        }
      ),

      h(
        ReferenceCard,
        {
          title:"Wards",
          items:wards
        }
      ),

      h(
        ReferenceCard,
        {
          title:"Beds",
          items:beds
        }
      )
    )
  );
}


/* =========================================================
   REFERENCE DATA CARD
   ========================================================= */

function ReferenceCard({
  title,
  items
}){

  return h(

    "div",
    {className:"card"},

    h(
      "h3",
      null,
      title
    ),

    items.length

    ?

    items.map(

      x =>

        h(
          "div",
          {
            className:"item",
            key:x.id
          },
          x.name
        )
    )

    :

    h(
      "p",
      {className:"muted"},
      "No entries yet."
    )
  );
}


/* =========================================================
   START APPLICATION
   ========================================================= */

createRoot(
  document.getElementById("root")
).render(
  h(App)
);

</script>

</body>
