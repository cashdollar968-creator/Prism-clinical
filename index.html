<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>PRISM — Clinical Documentation</title>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7f9;color:#17202a}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh}

    .login-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:linear-gradient(180deg,#eef8f7 0%,#f7fafb 100%)
    }

    .login-card{
      width:100%;
      max-width:430px;
      background:#fff;
      border:1px solid #dce5e8;
      border-radius:18px;
      padding:32px;
      box-shadow:0 12px 40px rgba(20,40,50,.08)
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:28px
    }

    .brand-mark{
      width:46px;
      height:46px;
      border-radius:12px;
      background:#0f766e;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:20px
    }

    .brand-title{
      font-size:25px;
      font-weight:800;
      letter-spacing:-.5px
    }

    .brand-subtitle{
      color:#64748b;
      font-size:13px;
      margin-top:2px
    }

    h1,h2,h3,p{margin-top:0}

    .login-title{
      font-size:22px;
      margin-bottom:22px
    }

    .field{margin-bottom:16px}

    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
      color:#334155
    }

    input,textarea,select{
      width:100%;
      border:1px solid #cbd5e1;
      border-radius:10px;
      padding:11px 12px;
      background:#fff;
      color:#17202a;
      outline:none
    }

    input:focus,textarea:focus,select:focus{
      border-color:#0f766e;
      box-shadow:0 0 0 3px rgba(15,118,110,.1)
    }

    textarea{
      min-height:100px;
      resize:vertical
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      font-weight:700;
      transition:.15s ease
    }

    .btn-primary{
      background:#0f766e;
      color:#fff
    }

    .btn-primary:hover{background:#0b625c}

    .btn-secondary{
      background:#e8eef0;
      color:#25343a
    }

    .btn-danger{
      background:#fee2e2;
      color:#991b1b
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed
    }

    .error{
      background:#fff1f2;
      border:1px solid #fecdd3;
      color:#9f1239;
      border-radius:10px;
      padding:11px 12px;
      margin-bottom:16px;
      font-size:13px;
      line-height:1.5
    }

    .success{
      background:#ecfdf5;
      border:1px solid #a7f3d0;
      color:#065f46;
      border-radius:10px;
      padding:11px 12px;
      margin-bottom:16px;
      font-size:13px
    }

    .loading{
      padding:40px;
      text-align:center;
      color:#64748b
    }

    .topbar{
      height:64px;
      background:#fff;
      border-bottom:1px solid #dce5e8;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      position:sticky;
      top:0;
      z-index:20
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:10px
    }

    .topbar-title{
      font-weight:800;
      font-size:18px
    }

    .role-badge{
      font-size:11px;
      font-weight:800;
      padding:4px 8px;
      border-radius:999px;
      background:#e6fffb;
      color:#0f766e;
      text-transform:uppercase
    }

    .layout{
      display:flex;
      min-height:calc(100vh - 64px)
    }

    .sidebar{
      width:220px;
      background:#fff;
      border-right:1px solid #dce5e8;
      padding:16px 12px;
      flex-shrink:0
    }

    .nav-btn{
      width:100%;
      text-align:left;
      border:0;
      background:transparent;
      padding:11px 12px;
      border-radius:9px;
      margin-bottom:5px;
      color:#475569;
      font-weight:650
    }

    .nav-btn:hover,.nav-btn.active{
      background:#eaf7f5;
      color:#0f766e
    }

    .content{
      flex:1;
      padding:22px;
      max-width:1500px;
      margin:0 auto;
      width:100%
    }

    .page-title{
      font-size:25px;
      font-weight:800;
      margin-bottom:5px
    }

    .page-subtitle{
      color:#64748b;
      font-size:14px;
      margin-bottom:22px
    }

    .grid{
      display:grid;
      gap:16px
    }

    .grid-4{grid-template-columns:repeat(4,1fr)}
    .grid-3{grid-template-columns:repeat(3,1fr)}
    .grid-2{grid-template-columns:repeat(2,1fr)}

    .card{
      background:#fff;
      border:1px solid #dce5e8;
      border-radius:14px;
      padding:18px;
      margin-bottom:16px
    }

    .stat-number{
      font-size:28px;
      font-weight:800;
      margin-top:5px
    }

    .stat-label{
      color:#64748b;
      font-size:13px
    }

    .section-title{
      font-size:17px;
      font-weight:800;
      margin-bottom:14px
    }

    .patient-card{
      cursor:pointer;
      transition:.15s ease
    }

    .patient-card:hover{
      border-color:#8ccbc5;
      transform:translateY(-1px)
    }

    .patient-name{
      font-size:17px;
      font-weight:800
    }

    .muted{color:#64748b}
    .small{font-size:12px}

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px
    }

    .wrap{flex-wrap:wrap}

    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase
    }

    .badge-stable{
      background:#dcfce7;
      color:#166534
    }

    .badge-improving{
      background:#dbeafe;
      color:#1d4ed8
    }

    .badge-deteriorating{
      background:#fef3c7;
      color:#92400e
    }

    .badge-unstable{
      background:#fee2e2;
      color:#991b1b
    }

    .timeline{
      position:relative;
      margin-top:10px
    }

    .timeline-item{
      border-left:3px solid #b8dcd8;
      padding:0 0 18px 18px;
      margin-left:7px
    }

    .timeline-dot{
      width:11px;
      height:11px;
      border-radius:50%;
      background:#0f766e;
      position:absolute;
      margin-left:-25px;
      margin-top:4px
    }

    .timeline-title{
      font-weight:800;
      margin-bottom:3px
    }

    .timeline-body{
      color:#475569;
      font-size:13px;
      line-height:1.55;
      white-space:pre-wrap
    }

    .table-wrap{overflow-x:auto}

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px
    }

    th,td{
      padding:10px;
      border-bottom:1px solid #e2e8f0;
      text-align:left;
      vertical-align:top
    }

    th{
      color:#475569;
      font-size:12px;
      text-transform:uppercase
    }

    .empty{
      padding:30px;
      text-align:center;
      color:#64748b
    }

    .form-actions{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      margin-top:15px
    }

    .detail-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px
    }

    .detail-box{
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:10px;
      padding:12px
    }

    .detail-label{
      font-size:11px;
      color:#64748b;
      font-weight:700;
      text-transform:uppercase;
      margin-bottom:5px
    }

    .detail-value{
      white-space:pre-wrap;
      line-height:1.5
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
      z-index:100
    }

    .modal{
      width:100%;
      max-width:700px;
      max-height:92vh;
      overflow-y:auto;
      background:#fff;
      border-radius:14px;
      padding:18px
    }

    @media(max-width:900px){
      .grid-4{grid-template-columns:repeat(2,1fr)}
      .sidebar{width:185px}
    }

    @media(max-width:700px){
      .layout{display:block}
      .sidebar{
        width:100%;
        border-right:0;
        border-bottom:1px solid #dce5e8;
        display:flex;
        overflow-x:auto;
        padding:8px;
        gap:5px
      }

      .nav-btn{
        white-space:nowrap;
        width:auto;
        margin:0
      }

      .content{padding:14px}

      .grid-4,.grid-3,.grid-2,.detail-grid{
        grid-template-columns:1fr
      }

      .topbar{padding:0 12px}
      .topbar-title{font-size:16px}
      .login-card{padding:24px}
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="module">
import React,{useEffect,useMemo,useState} from "https://esm.sh/react@18.3.1";
import{createRoot}from"https://esm.sh/react-dom@18.3.1/client";
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";

/* =========================================================
   PRISM — Supabase configuration
   ========================================================= */

const SUPABASE_URL="https://rcikgkdesnlfewkfeybv.supabase.co";

const SUPABASE_KEY="sb_publishable_Nm1XfSDRO1O_2qY20Q_eSQ_Sfh0DiCf";

const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const h=React.createElement;

/* =========================================================
   Helpers
   ========================================================= */

function formatDate(value){
  if(!value)return"—";
  try{return new Date(value).toLocaleString();}
  catch{return value;}
}

function roleLabel(role){
  if(role==="medical_officer")return"Medical Officer";
  if(role==="specialist")return"Specialist";
  if(role==="admin")return"Admin";
  return role||"User";
}

function stabilityClass(value){
  return{
    stable:"badge-stable",
    improving:"badge-improving",
    deteriorating:"badge-deteriorating",
    unstable:"badge-unstable"
  }[value]||"";
}

/* =========================================================
   Login
   ========================================================= */

function Login({onLogin}){
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function submit(e){
    e.preventDefault();
    setError("");

    if(!email||!password){
      setError("Please enter both email and password.");
      return;
    }

    setLoading(true);

    const{data,error}=await db.auth.signInWithPassword({
      email:email.trim(),
      password
    });

    setLoading(false);

    if(error){
      setError(error.message||"Unable to sign in.");
      return;
    }

    if(!data?.user){
      setError("Authentication succeeded but no user was returned.");
      return;
    }

    onLogin(data.user);
  }

  return h("div",{className:"login-page"},
    h("div",{className:"login-card"},

      h("div",{className:"brand"},
        h("div",{className:"brand-mark"},"P"),
        h("div",null,
          h("div",{className:"brand-title"},"PRISM"),
          h("div",{className:"brand-subtitle"},
            "Problem-oriented Inpatient Review & Structured Monitoring"
          )
        )
      ),

      h("h2",{className:"login-title"},"Sign in"),

      error?h("div",{className:"error"},error):null,

      h("form",{onSubmit:submit},

        h("div",{className:"field"},
          h("label",null,"Email"),
          h("input",{
            type:"email",
            value:email,
            autoComplete:"username",
            onChange:e=>setEmail(e.target.value),
            placeholder:"name@example.com"
          })
        ),

        h("div",{className:"field"},
          h("label",null,"Password"),
          h("input",{
            type:"password",
            value:password,
            autoComplete:"current-password",
            onChange:e=>setPassword(e.target.value),
            placeholder:"Password"
          })
        ),

        h("button",{
          className:"btn btn-primary",
          type:"submit",
          disabled:loading,
          style:{width:"100%"}
        },loading?"Signing in...":"Sign in")
      )
    )
  );
}

/* =========================================================
   Root App
   ========================================================= */

function App(){
  const[session,setSession]=useState(null);
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState("");

  async function loadProfile(user){
    setError("");

    const{data,error}=await db
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

    if(error){
      setError(
        "Authentication succeeded, but PRISM could not load your profile: "+
        error.message
      );
      setProfile(null);
      return;
    }

    if(!data){
      setError(
        "Your Supabase account exists, but no PRISM profile exists for this user. An administrator must create the PRISM profile."
      );
      setProfile(null);
      return;
    }

    if(data.active===false){
      setError("This PRISM account is inactive.");
      setProfile(null);
      return;
    }

    setProfile(data);
  }

  useEffect(()=>{
    let mounted=true;

    async function initialize(){
      const{
        data:{session}
      }=await db.auth.getSession();

      if(!mounted)return;

      setSession(session);

      if(session?.user){
        await loadProfile(session.user);
      }

      setLoading(false);
    }

    initialize();

    const{
      data:{subscription}
    }=db.auth.onAuthStateChange(async(_event,newSession)=>{
      if(!mounted)return;

      setSession(newSession);

      if(newSession?.user){
        await loadProfile(newSession.user);
      }else{
        setProfile(null);
      }
    });

    return()=>{
      mounted=false;
      subscription.unsubscribe();
    };
  },[]);

  if(loading){
    return h("div",{className:"loading"},"Loading PRISM...");
  }

  if(!session){
    return h(Login,{
      onLogin:user=>setSession({user})
    });
  }

  if(!profile){
    return h("div",{className:"login-page"},
      h("div",{className:"login-card"},

        h("div",{className:"brand"},
          h("div",{className:"brand-mark"},"P"),
          h("div",null,
            h("div",{className:"brand-title"},"PRISM"),
            h("div",{className:"brand-subtitle"},"Clinical Documentation")
          )
        ),

        error?h("div",{className:"error"},error):null,

        h("button",{
          className:"btn btn-secondary",
          onClick:async()=>await db.auth.signOut()
        },"Sign out")
      )
    );
  }

  return h(MainApp,{profile});
}

/* =========================================================
   Main Application
   ========================================================= */

function MainApp({profile}){
  const[page,setPage]=useState("dashboard");
  const[patients,setPatients]=useState([]);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState("");
  const[selectedPatient,setSelectedPatient]=useState(null);

  async function loadPatients(){
    setLoading(true);
    setError("");

    const{data,error}=await db
      .from("patients")
      .select(`
        id,
        patient_code,
        full_name,
        age,
        sex,
        demo,
        created_at,
        admissions(
          id,
          ward_id,
          bed_id,
          admission_datetime,
          discharge_datetime,
          status,
          responsible_mo_id,
          specialist_id,
          reason_for_admission,
          brief_summary,
          working_diagnosis,
          relevant_background,
          baseline_clinical_status,
          baseline_investigations,
          initial_plan,
          goals_targets,
          created_at
        )
      `)
      .order("created_at",{ascending:false});

    if(error){
      setError(error.message);
      setPatients([]);
    }else{
      setPatients(data||[]);
    }

    setLoading(false);
  }

  useEffect(()=>{
    loadPatients();
  },[]);

  async function logout(){
    await db.auth.signOut();
  }

  const activeAdmissions=useMemo(()=>{
    return patients.flatMap(patient=>
      (patient.admissions||[])
      .filter(a=>a.status==="active")
      .map(admission=>({patient,admission}))
    );
  },[patients]);

  function openPatient(patient){
    setSelectedPatient(patient);
    setPage("patient");
  }

  function nav(name){
    setPage(name);
    if(name!=="patient")setSelectedPatient(null);
  }

  return h("div",{className:"app"},

    h("header",{className:"topbar"},

      h("div",{className:"topbar-left"},
        h("div",{
          className:"brand-mark",
          style:{width:36,height:36,fontSize:16}
        },"P"),

        h("div",{className:"topbar-title"},"PRISM"),

        h("span",{className:"role-badge"},
          roleLabel(profile.role)
        )
      ),

      h("button",{
        className:"btn btn-secondary",
        onClick:logout
      },"Sign out")
    ),

    h("div",{className:"layout"},

      h("aside",{className:"sidebar"},

        h("button",{
          className:"nav-btn "+(page==="dashboard"?"active":""),
          onClick:()=>nav("dashboard")
        },"Dashboard"),

        h("button",{
          className:"nav-btn "+(page==="patients"?"active":""),
          onClick:()=>nav("patients")
        },"Patients"),

        h("button",{
          className:"nav-btn "+(page==="specialists"?"active":""),
          onClick:()=>nav("specialists")
        },"Specialist Queue"),

        profile.role==="admin"
          ?h("button",{
              className:"nav-btn "+(page==="admin"?"active":""),
              onClick:()=>nav("admin")
            },"Administration")
          :null
      ),

      h("main",{className:"content"},

        error?h("div",{className:"error"},error):null,

        page==="dashboard"
          ?h(Dashboard,{
              activeAdmissions,
              onOpenPatient:openPatient
            })
          :null,

        page==="patients"
          ?h(PatientsPage,{
              patients,
              loading,
              onRefresh:loadPatients,
              onOpenPatient:openPatient
            })
          :null,

        page==="patient"&&selectedPatient
          ?h(PatientPage,{
              patient:selectedPatient,
              profile
            })
          :null,

        page==="specialists"
          ?h(SpecialistQueue,{profile})
          :null,

        page==="admin"&&profile.role==="admin"
          ?h(AdminPage,{profile})
          :null
      )
    )
  );
}

/* =========================================================
   Dashboard
   ========================================================= */

function Dashboard({activeAdmissions,onOpenPatient}){
  const stable=activeAdmissions.filter(x=>{
    const latest=x.admission.latest_stability;
    return latest==="stable";
  }).length;

  return h(React.Fragment,null,

    h("div",{className:"page-title"},"Dashboard"),

    h("div",{className:"page-subtitle"},
      "Current inpatient overview"
    ),

    h("div",{className:"grid grid-4"},

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"Active Admissions"),
        h("div",{className:"stat-number"},
          activeAdmissions.length
        )
      ),

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"Stable"),
        h("div",{className:"stat-number"},stable)
      ),

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"Needs Review"),
        h("div",{className:"stat-number"},
          activeAdmissions.filter(x=>
            x.admission.specialist_id
          ).length
        )
      ),

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"PRISM"),
        h("div",{className:"stat-number"},"Active")
      )
    ),

    h("div",{className:"card"},

      h("div",{className:"section-title"},
        "Current Patients"
      ),

      activeAdmissions.length===0
        ?h("div",{className:"empty"},
          "No active admissions available."
        )
        :activeAdmissions.map(({patient,admission})=>
          h("div",{
            key:admission.id,
            className:"card patient-card",
            onClick:()=>onOpenPatient(patient)
          },

            h("div",{className:"row wrap"},

              h("div",null,
                h("div",{className:"patient-name"},
                  patient.full_name||"Unnamed patient"
                ),

                h("div",{className:"muted small"},
                  patient.patient_code||"No patient code"
                )
              ),

              h("div",null,
                admission.latest_stability
                  ?h("span",{
                      className:
                        "badge "+
                        stabilityClass(
                          admission.latest_stability
                        )
                    },
                    admission.latest_stability
                  )
                  :h("span",{className:"badge"},
                    "ACTIVE"
                  )
              )
            ),

            h("div",{
              className:"small",
              style:{marginTop:10}
            },
              admission.working_diagnosis||
              "Working diagnosis not documented"
            )
          )
        )
    )
  );
}

/* =========================================================
   Patients
   ========================================================= */

function PatientsPage({
  patients,
  loading,
  onRefresh,
  onOpenPatient
}){
  const[search,setSearch]=useState("");

  const filtered=patients.filter(p=>{
    const text=(
      (p.full_name||"")+" "+
      (p.patient_code||"")
    ).toLowerCase();

    return text.includes(search.toLowerCase());
  });

  return h(React.Fragment,null,

    h("div",{className:"page-title"},"Patients"),

    h("div",{className:"page-subtitle"},
      "Patient and admission overview"
    ),

    h("div",{className:"card"},

      h("div",{className:"row wrap"},

        h("input",{
          style:{maxWidth:500},
          placeholder:"Search patient or patient code",
          value:search,
          onChange:e=>setSearch(e.target.value)
        }),

        h("button",{
          className:"btn btn-secondary",
          onClick:onRefresh
        },"Refresh")
      )
    ),

    h("div",{className:"card"},

      loading
        ?h("div",{className:"loading"},"Loading patients...")
        :filtered.length===0
          ?h("div",{className:"empty"},"No patients found.")
          :filtered.map(patient=>
            h("div",{
              key:patient.id,
              className:"card patient-card",
              onClick:()=>onOpenPatient(patient)
            },

              h("div",{className:"row wrap"},

                h("div",null,
                  h("div",{className:"patient-name"},
                    patient.full_name||"Unnamed"
                  ),

                  h("div",{className:"muted small"},
                    patient.patient_code||"—"
                  )
                ),

                h("div",{className:"small"},
                  patient.demo?"DEMO":"OPERATIONAL"
                )
              ),

/* =========================================================
   Patient Page
   ========================================================= */

function PatientPage({patient,profile}){
  const admission=(patient.admissions||[]).find(
    a=>a.status==="active"
  )||(patient.admissions||[])[0];

  const[clinical,setClinical]=useState({
    problems:[],
    updates:[],
    investigations:[],
    reviews:[]
  });

  const[loading,setLoading]=useState(true);
  const[error,setError]=useState("");
  const[showFollowup,setShowFollowup]=useState(false);

  async function loadClinicalData(){
    if(!admission)return;

    setLoading(true);
    setError("");

    const[
      problems,
      updates,
      investigations,
      requests
    ]=await Promise.all([

      db.from("problems")
        .select("*")
        .eq("admission_id",admission.id)
        .order("problem_no"),

      db.from("daily_updates")
        .select("*")
        .eq("admission_id",admission.id)
        .order("occurred_at",{ascending:false}),

      db.from("investigations")
        .select("*")
        .eq("admission_id",admission.id)
        .order("performed_at",{ascending:false}),

      db.from("specialist_requests")
        .select("*, specialist_reviews(*)")
        .eq("admission_id",admission.id)
        .order("requested_at",{ascending:false})
    ]);

    const errors=[
      problems.error,
      updates.error,
      investigations.error,
      requests.error
    ].filter(Boolean);

    if(errors.length){
      setError(errors.map(e=>e.message).join(" | "));
    }

    const reviews=(requests.data||[]).flatMap(
      r=>r.specialist_reviews||[]
    );

    setClinical({
      problems:problems.data||[],
      updates:updates.data||[],
      investigations:investigations.data||[],
      reviews
    });

    setLoading(false);
  }

  useEffect(()=>{
    loadClinicalData();
  },[admission?.id]);

  if(!admission){
    return h("div",{className:"card"},
      h("div",{className:"empty"},
        "No admission found for this patient."
      )
    );
  }

  return h(React.Fragment,null,

    h("div",{className:"page-title"},
      patient.full_name||"Patient"
    ),

    h("div",{className:"page-subtitle"},
      (patient.patient_code||"No patient code")+
      " • "+
      (patient.age??"—")+
      " years • "+
      (patient.sex||"—")
    ),

    error?h("div",{className:"error"},error):null,

    h("div",{className:"row wrap",style:{marginBottom:12}},

      h("button",{
        className:"btn btn-primary",
        onClick:()=>setShowFollowup(true)
      },"Add Daily Follow-up"),

      h("span",{className:"badge"},
        admission.status||"—"
      )
    ),

    h("div",{className:"card"},

      h("div",{className:"section-title"},
        "Admission Summary"
      ),

      h("div",{className:"detail-grid"},

        detail("Admission Date",
          formatDate(admission.admission_datetime)),

        detail("Working Diagnosis",
          admission.working_diagnosis),

        detail("Reason for Admission",
          admission.reason_for_admission),

        detail("Brief Summary",
          admission.brief_summary),

        detail("Relevant Background",
          admission.relevant_background),

        detail("Baseline Clinical Status",
          admission.baseline_clinical_status),

        detail("Baseline Investigations",
          admission.baseline_investigations),

        detail("Initial Plan",
          admission.initial_plan),

        detail("Goals / Targets",
          admission.goals_targets)
      )
    ),

    h("div",{className:"card"},

      h("div",{className:"section-title"},
        "Active Problems"
      ),

      loading
        ?h("div",{className:"loading"},"Loading...")
        :clinical.problems.length===0
          ?h("div",{className:"empty"},
            "No problems documented."
          )
          :clinical.problems.map(problem=>
            h("div",{
              key:problem.id,
              className:"detail-box",
              style:{marginBottom:10}
            },

              h("div",{className:"row wrap"},

                h("strong",null,
                  "P"+
                  (problem.problem_no??"")+
                  " — "+
                  (problem.problem||"Problem")
                ),

                h("span",{className:"badge"},
                  problem.active?"ACTIVE":"INACTIVE"
                )
              ),

              h("div",{className:"small",style:{marginTop:8}},
                h("strong",null,"Status: "),
                problem.current_status||"—"
              ),

              h("div",{className:"small",style:{marginTop:6}},
                h("strong",null,"Goal: "),
                problem.goal_target||"—"
              ),

              h("div",{className:"small",style:{marginTop:6}},
                h("strong",null,"Management: "),
                problem.initial_management||"—"
              ),

              h("div",{className:"small",style:{marginTop:6}},
                h("strong",null,"Monitoring: "),
                problem.monitoring||"—"
              )
            )
          )
    ),

    h("div",{className:"card"},

      h("div",{className:"section-title"},
        "Investigations"
      ),

      clinical.investigations.length===0
        ?h("div",{className:"empty"},
          "No investigations documented."
        )
        :h("div",{className:"table-wrap"},

          h("table",null,

            h("thead",null,
              h("tr",null,
                h("th",null,"Category"),
                h("th",null,"Test"),
                h("th",null,"Date / Time"),
                h("th",null,"Result"),
                h("th",null,"Clinical Significance")
              )
            ),

            h("tbody",null,

              clinical.investigations.map(item=>
                h("tr",{key:item.id},

                  h("td",null,item.category||"—"),
                  h("td",null,item.test_name||"—"),
                  h("td",null,formatDate(item.performed_at)),
                  h("td",null,item.result||"—"),
                  h("td",null,item.clinical_significance||"—")
                )
              )
            )
          )
        )
    ),

    h("div",{className:"card"},

      h("div",{className:"section-title"},
        "Clinical Timeline"
      ),

      clinical.updates.length===0
        ?h("div",{className:"empty"},
          "No daily follow-ups documented."
        )
        :h("div",{className:"timeline"},

          clinical.updates.map(update=>
            h("div",{
              key:update.id,
              className:"timeline-item"
            },

              h("div",{className:"timeline-dot"}),

              h("div",{className:"timeline-title"},
                formatDate(update.occurred_at)
              ),

              h("div",{style:{marginBottom:7}},
                h("span",{
                  className:
                    "badge "+
                    stabilityClass(
                      update.clinical_stability
                    )
                },
                  update.clinical_stability||
                  "—"
                )
              ),

              update.clinical_changes
                ?h("div",{className:"timeline-body"},
                  "Clinical changes: "+
                  update.clinical_changes
                ):null,

              update.new_results
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Results: "+
                  update.new_results
                ):null,

              update.problems_assessment
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Assessment: "+
                  update.problems_assessment
                ):null,

              update.response
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Response: "+
                  update.response
                ):null,

              update.management_changes
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Management: "+
                  update.management_changes
                ):null,

              update.remaining_inpatient_needs
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Remaining needs: "+
                  update.remaining_inpatient_needs
                ):null,

              update.why_still_admitted
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Why still admitted: "+
                  update.why_still_admitted
                ):null,

              update.recommendation_next_steps
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Next: "+
                  update.recommendation_next_steps
                ):null,

              update.escalation_red_flags
                ?h("div",{
                    className:"timeline-body",
                    style:{marginTop:6}
                  },
                  "Escalation / red flags: "+
                  update.escalation_red_flags
                ):null
            )
          )
        )
    ),

    clinical.reviews.length>0
      ?h("div",{className:"card"},

        h("div",{className:"section-title"},
          "Specialist Reviews"
        ),

        clinical.reviews.map(review=>
          h("div",{
            key:review.id,
            style:{
              borderBottom:"1px solid #e2e8f0",
              padding:"12px 0"
            }
          },

            h("strong",null,
              formatDate(review.reviewed_at)
            ),

            review.clinical_assessment
              ?h("div",{
                  className:"small",
                  style:{
                    marginTop:7,
                    whiteSpace:"pre-wrap"
                  }
                },
                review.clinical_assessment
              ):null,

            review.recommendations
              ?h("div",{
                  className:"small",
                  style:{
                    marginTop:7,
                    whiteSpace:"pre-wrap"
                  }
                },
                review.recommendations
              ):null
          )
        )
      )
      :null,

    showFollowup
      ?h(FollowupModal,{
          admissionId:admission.id,
          onClose:()=>setShowFollowup(false),
          onSaved:async()=>{
            setShowFollowup(false);
            await loadClinicalData();
          }
        })
      :null
  );
}

function detail(label,value){
  return h("div",{className:"detail-box"},
    h("div",{className:"detail-label"},label),
    h("div",{className:"detail-value"},
      value||"—"
    )
  );
}

/* =========================================================
   Daily Follow-up
   ========================================================= */

function FollowupModal({admissionId,onClose,onSaved}){
  const[form,setForm]=useState({
    clinical_changes:"",
    new_results:"",
    problems_assessment:"",
    clinical_stability:"stable",
    response:"",
    management_changes:"",
    remaining_inpatient_needs:"",
    why_still_admitted:"",
    recommendation_next_steps:"",
    escalation_red_flags:""
  });

  const[saving,setSaving]=useState(false);
  const[error,setError]=useState("");

  function update(field,value){
    setForm(old=>({...old,[field]:value}));
  }

  async function save(){
    setError("");

    if(!form.clinical_stability){
      setError("Clinical stability is required.");
      return;
    }

    setSaving(true);

    const{
      data:{user}
    }=await db.auth.getUser();

    if(!user){
      setSaving(false);
      setError("Authentication session expired.");
      return;
    }

    const{error}=await db
      .from("daily_updates")
      .insert({
        admission_id:admissionId,
        author_id:user.id,
        occurred_at:new Date().toISOString(),
        clinical_changes:form.clinical_changes,
        new_results:form.new_results,
        problems_assessment:form.problems_assessment,
        clinical_stability:form.clinical_stability,
        response:form.response,
        management_changes:form.management_changes,
        remaining_inpatient_needs:form.remaining_inpatient_needs,
        why_still_admitted:form.why_still_admitted,
        recommendation_next_steps:form.recommendation_next_steps,
        escalation_red_flags:form.escalation_red_flags
      });

    setSaving(false);

    if(error){
      setError(error.message);
      return;
    }

    await onSaved();
  }

  return h("div",{className:"modal-backdrop"},

    h("div",{className:"modal"},

      h("div",{className:"row"},

        h("div",{className:"section-title"},
          "Daily Follow-up"
        ),

        h("button",{
          className:"btn btn-secondary",
          onClick:onClose
        },"Close")
      ),

      error?h("div",{className:"error"},error):null,

      FollowupField(
        "Clinical Changes / Events",
        form.clinical_changes,
        v=>update("clinical_changes",v)
      ),

      FollowupField(
        "New Important Results",
        form.new_results,
        v=>update("new_results",v)
      ),

      FollowupField(
        "Problems / Assessment",
        form.problems_assessment,
        v=>update("problems_assessment",v)
      ),

      h("div",{className:"field"},

        h("label",null,"Clinical Stability *"),

        h("select",{
          value:form.clinical_stability,
          onChange:e=>
            update("clinical_stability",e.target.value)
        },

          h("option",{value:"stable"},"Stable"),
          h("option",{value:"improving"},"Improving"),
          h("option",{value:"deteriorating"},"Deteriorating"),
          h("option",{value:"unstable"},"Unstable")
        )
      ),

      FollowupField(
        "Response",
        form.response,
        v=>update("response",v)
      ),

      FollowupField(
        "Management Changes",
        form.management_changes,
        v=>update("management_changes",v)
      ),

      FollowupField(
        "Remaining Inpatient Needs",
        form.remaining_inpatient_needs,
        v=>update("remaining_inpatient_needs",v)
      ),

      FollowupField(
        "Why Still Admitted",
        form.why_still_admitted,
        v=>update("why_still_admitted",v),
        "Oxygen / IV treatment / monitoring / unstable status / pending investigation / specialist decision / procedure / other"
      ),

      FollowupField(
        "Recommendation / Next Steps",
        form.recommendation_next_steps,
        v=>update("recommendation_next_steps",v)
      ),

      FollowupField(
        "Escalation / Red Flags",
        form.escalation_red_flags,
        v=>update("escalation_red_flags",v)
      ),

      h("div",{className:"form-actions"},

        h("button",{
          className:"btn btn-secondary",
          onClick:onClose,
          disabled:saving
        },"Cancel"),

        h("button",{
          className:"btn btn-primary",
          onClick:save,
          disabled:saving
        },
          saving?"Saving...":"Save Follow-up"
        )
      )
    )
  );
}

function FollowupField(label,value,onChange,placeholder){
  return h("div",{className:"field"},

    h("label",null,label),

    h("textarea",{
      value,
      placeholder:placeholder||"",
      onChange:e=>onChange(e.target.value)
    })
  );
}

/* =========================================================
   Specialist Queue
   ========================================================= */

function SpecialistQueue({profile}){
  const[requests,setRequests]=useState([]);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState("");

  async function load(){
    setLoading(true);
    setError("");

    let query=db
      .from("specialist_requests")
      .select("*")
      .order("requested_at",{ascending:false});

    if(profile.role==="specialist"){
      query=query.eq("specialist_id",profile.id);
    }

    const{data,error}=await query;

    if(error){
      setError(error.message);
      setRequests([]);
    }else{
      setRequests(data||[]);
    }

    setLoading(false);
  }

  useEffect(()=>{
    load();
  },[]);

  return h(React.Fragment,null,

    h("div",{className:"page-title"},
      "Specialist Queue"
    ),

    h("div",{className:"page-subtitle"},
      "Specialist requests and review status"
    ),

    error?h("div",{className:"error"},error):null,

    h("div",{className:"card"},

      loading
        ?h("div",{className:"loading"},"Loading...")
        :requests.length===0
          ?h("div",{className:"empty"},
            "No specialist requests available."
          )
          :h("div",{className:"table-wrap"},

            h("table",null,

              h("thead",null,
                h("tr",null,
                  h("th",null,"Priority"),
                  h("th",null,"Reason"),
                  h("th",null,"Clinical Question"),
                  h("th",null,"Status"),
                  h("th",null,"Requested")
                )
              ),

              h("tbody",null,

                requests.map(request=>
                  h("tr",{key:request.id},

                    h("td",null,request.priority||"—"),
                    h("td",null,request.reason||"—"),
                    h("td",null,request.clinical_question||"—"),
                    h("td",null,request.status||"—"),
                    h("td",null,
                      formatDate(request.requested_at)
                    )
                  )
                )
              )
            )
          )
    )
  );
}

function AdminPage(){
  const[profiles,setProfiles]=useState([]);
  const[departments,setDepartments]=useState([]);
  const[wards,setWards]=useState([]);
  const[beds,setBeds]=useState([]);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState("");

  async function load(){
    setLoading(true);
    setError("");

    const[p,d,w,b]=await Promise.all([

      db.from("profiles")
        .select("*")
        .order("created_at",{ascending:false}),

      db.from("departments")
        .select("*")
        .order("name"),

      db.from("wards")
        .select("*")
        .order("name"),

      db.from("beds")
        .select("*")
        .order("name")
    ]);

    const errors=[
      p.error,d.error,w.error,b.error
    ].filter(Boolean);

    if(errors.length){

    setProfiles(p.data||[]);

  useEffect(()=>{

        h("div",{className:"stat-label"},"Departments"),

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"Wards"),
        h("div",{className:"stat-number"},wards.length)
      ),

      h("div",{className:"card"},
        h("div",{className:"stat-label"},"Beds"),
        h("div",{className:"stat-number"},beds.length)
      )
    ),

    h("div",{className:"card"},

      h("div",{className:"row"},

        h("div",{className:"section-title"},
          "PRISM Users"
        ),

        h("button",{
          className:"btn btn-secondary",
          onClick:load
        },"Refresh")
      ),

      loading
        ?h("div",{className:"loading"},"Loading...")
        :profiles.length===0
          ?h("div",{className:"empty"},
            "No PRISM profiles found."
          )
          :h("div",{className:"table-wrap"},

              h("thead",null,
                h("tr",null,
                  h("th",null,"Name"),

                  h("th",null,"Role"),
                  h("th",null,"Active")

                    h("td",null,

                    h("td",null,
                      user.active?"Yes":"No"
                    )
                  )
                )
              )
            )
          )
    )
  );
